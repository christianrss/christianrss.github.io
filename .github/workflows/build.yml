name: Build MDS portfolio

on:
  push:
    branches:
      - main
      - "redesign/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate MDS
        run: npm run check

      - name: Render standalone HTML
        run: npm run build

      - name: Verify generated page
        run: |
          test -s index.html
          grep -q "Christian Rafael de Souza Silva" index.html
          grep -q "ChrisOS" index.html
          grep -q "ML Systems" index.html

      - name: Commit generated artifact
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- index.html package-lock.json && [ -f package-lock.json ]; then
            echo "Generated output is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: render portfolio from MDS [skip ci]"
          git push
