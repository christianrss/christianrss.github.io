name: Build multilingual MDS portfolio

on:
  push:
    branches:
      - main
      - "redesign/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for PDF rendering
        run: npx playwright install --with-deps chromium

      - name: Validate MDS sources
        run: npm run check

      - name: Build multilingual site
        run: npm run build

      - name: Render professional PDFs
        run: npm run pdf

      - name: Verify generated outputs
        run: |
          test -s index.html
          test -s assets/christian-rafael-photo.jpg
          grep -q 'assets/christian-rafael-photo.jpg' en/index.html pt/index.html resume/en/index.html resume/pt/index.html
          test -s en/index.html
          test -s pt/index.html
          test -s resume/en/index.html
          test -s resume/pt/index.html
          test -s resume/christian-rafael-cv-en.pdf
          test -s resume/christian-rafael-cv-pt.pdf
          grep -q "Selected projects" en/index.html
          grep -q "Systems map" en/index.html
          grep -q "Projetos selecionados" pt/index.html
          grep -q "Mapa de sistemas" pt/index.html
          grep -q "Professional Resume" resume/en/index.html
          grep -q "Currículo Profissional" resume/pt/index.html
          grep -q 'hreflang="pt-BR"' en/index.html
          grep -q 'hreflang="en"' pt/index.html
          grep -q 'https://me.christiansoftware.org/' index.html
          grep -q 'https://me.christiansoftware.org/en/' en/index.html
          grep -q 'https://me.christiansoftware.org/pt/' pt/index.html
          grep -q 'G-YJZ32MBJRQ' en/index.html
          grep -q 'G-YJZ32MBJRQ' pt/index.html
          grep -q 'G-YJZ32MBJRQ' index.html
          grep -q 'G-YJZ32MBJRQ' resume/en/index.html
          grep -q 'G-YJZ32MBJRQ' resume/pt/index.html
          ! grep -q 'G-4XBNJTK0EG' en/index.html pt/index.html
          grep -q 'https://me.christiansoftware.org/resume/en/' resume/en/index.html
          grep -q 'https://me.christiansoftware.org/resume/pt/' resume/pt/index.html
          grep -q 'href="https://me.christiansoftware.org/">me.christiansoftware.org</a>' resume/en/index.html
          grep -q 'href="https://me.christiansoftware.org/">me.christiansoftware.org</a>' resume/pt/index.html
          grep -q 'https://me.christiansoftware.org/sitemap.xml' robots.txt
          grep -q 'https://me.christiansoftware.org/en/' sitemap.xml
          grep -q 'https://me.christiansoftware.org/en/' llms.txt
          test "$(tr -d '\r\n' < CNAME)" = "me.christiansoftware.org"
          ! grep -q 'https://christianrss.github.io' index.html en/index.html pt/index.html resume/en/index.html resume/pt/index.html sitemap.xml robots.txt llms.txt

      - name: Commit generated artifacts
        if: github.event_name == 'push'
        shell: bash
        run: |
          GENERATED=(
            index.html
            en/index.html
            pt/index.html
            resume/en/index.html
            resume/pt/index.html
            resume/christian-rafael-cv-en.pdf
            resume/christian-rafael-cv-pt.pdf
            package-lock.json
          )

          if [ -z "$(git status --porcelain -- "${GENERATED[@]}")" ]; then
            echo "Generated output is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${GENERATED[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: render multilingual site and resumes [skip ci]"
          git push
